<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="UCYSS">
  <title>UCYSS</title>
  <!-- Plate matches --color-void so the tab blends into a dark browser chrome -->
  <rect width="32" height="32" fill="#05070C"/>

  <!-- Shield: brand blue outline on the surface tone -->
  <path d="M16 3.2 6.2 6.6v8.6c0 5.7 3.9 10.8 9.8 12.1 5.9-1.3 9.8-6.4 9.8-12.1V6.6L16 3.2Z"
        fill="#0B1017" stroke="#1848F8" stroke-width="1.9" stroke-linejoin="round"/>

  <!-- Inner constellation: accent teal, three nodes and the lines between them -->
  <g stroke="#18D0C0" stroke-width="1.4" stroke-linecap="round" fill="none" stroke-opacity=".85">
    <path d="M11.2 18.4 16 10.4 20.8 18.4"/>
    <path d="M11.2 18.4h9.6"/>
  </g>
  <g fill="#18D0C0">
    <circle cx="16" cy="10.4" r="2.1"/>
    <circle cx="11.2" cy="18.4" r="1.7"/>
    <circle cx="20.8" cy="18.4" r="1.7"/>
    <rect x="14.7" y="21.4" width="2.6" height="2.6"/>
  </g>
</svg>
